name: voxo
description: VOXO - Enterprise Voice Chat & Live Social Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  go_router: ^13.0.0
  dio: ^5.4.0
  retrofit: ^4.1.0
  json_annotation: ^4.8.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  socket_io_client: ^2.0.3+1
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  lottie: ^3.0.0
  video_player: ^2.8.1
  image_picker: ^1.0.7
  permission_handler: ^11.2.0
  local_auth: ^2.1.8
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^16.3.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  intl: ^0.19.0
  timeago: ^3.6.1
  url_launcher: ^6.2.4
  share_plus: ^7.2.1
  path_provider: ^2.1.2
  fl_chart: ^0.66.2
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  pinput: ^3.0.1
  country_code_picker: ^3.0.0
  image_cropper: ^5.0.1
  confetti: ^0.7.0
  audioplayers: ^5.2.1
  just_audio: ^0.9.36
  record: ^5.0.4
  wakelock_plus: ^1.1.4
  connectivity_plus: ^5.0.2
  package_info_plus: ^5.0.1
  device_info_plus: ^9.1.1
  flutter_screenutil: ^5.9.0
  gap: ^3.0.1
  modal_bottom_sheet: ^3.0.0
  pull_to_refresh: ^2.0.0
  infinite_scroll_pagination: ^4.0.0
  smooth_page_indicator: ^1.1.0
  badges: ^3.1.2
  glassmorphism: ^3.0.0
  in_app_purchase: ^3.1.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  json_serializable: ^6.7.1
  retrofit_generator: ^8.1.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/
  # Font files: download Poppins from https://fonts.google.com/specimen/Poppins
  # Place TTF files in assets/fonts/ then uncomment:
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
