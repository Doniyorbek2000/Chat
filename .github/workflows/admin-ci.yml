name: Admin Panel CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'admin/**'
      - '.github/workflows/admin-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'admin/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/voxo-admin
  NODE_VERSION: '20'

jobs:
  # ==================== LINT ====================
  lint:
    name: ESLint & TypeScript Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

  # ==================== BUILD ====================
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin

    env:
      NEXT_PUBLIC_API_URL: https://api.voxo.app
      NEXTAUTH_URL: https://admin.voxo.app
      NEXTAUTH_SECRET: build-check-secret-min-32-chars-xxx

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: admin-build
          path: admin/.next/
          retention-days: 1

  # ==================== BUILD & PUSH DOCKER IMAGE ====================
  docker-build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [lint, build-check]
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: ./admin
          file: ./admin/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ github.ref == 'refs/heads/main' && 'https://api.voxo.app' || 'https://api-staging.voxo.app' }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

  # ==================== DEPLOY STAGING ====================
  deploy-staging:
    name: Deploy Admin to Staging
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: https://admin-staging.voxo.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to staging server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          script: |
            set -e
            cd /opt/voxo

            echo "IMAGE_TAG=${{ needs.docker-build.outputs.image_tag }}" > .env.deploy

            # Pull new admin image
            docker compose -f docker-compose.prod.yml pull voxo-admin

            # Rolling update
            docker compose -f docker-compose.prod.yml up -d --no-deps voxo-admin

            # Health check
            sleep 15
            curl -f https://admin-staging.voxo.app || exit 1

            echo "Admin staging deployment successful"

  # ==================== DEPLOY PRODUCTION ====================
  deploy-production:
    name: Deploy Admin to Production
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://admin.voxo.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to production server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          script: |
            set -e
            cd /opt/voxo

            echo "IMAGE_TAG=${{ needs.docker-build.outputs.image_tag }}" > .env.deploy

            # Pull new admin image
            docker compose -f docker-compose.prod.yml pull voxo-admin

            # Rolling update
            docker compose -f docker-compose.prod.yml up -d --no-deps voxo-admin

            # Health check with retries
            for i in 1 2 3 4 5; do
              sleep 10
              curl -f https://admin.voxo.app && break || echo "Attempt $i failed"
            done

            curl -f https://admin.voxo.app || exit 1
            echo "Admin production deployment successful"

      - name: Create deployment tag
        if: success()
        run: |
          git tag "deploy/admin-prod-$(date +%Y%m%d-%H%M%S)"
          git push origin --tags
