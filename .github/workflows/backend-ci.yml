name: Backend CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/voxo-backend
  NODE_VERSION: '20'

jobs:
  # ==================== LINT ====================
  lint:
    name: ESLint Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npx prettier --check "src/**/*.ts"

  # ==================== UNIT TESTS ====================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: voxo_test
          POSTGRES_USER: voxo
          POSTGRES_PASSWORD: voxo_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://voxo:voxo_test_password@localhost:5432/voxo_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-jwt-secret-key-min-32-chars-long
      JWT_REFRESH_SECRET: test-refresh-secret-key-min-32-chars-long
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: voxo-test
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      ZEGOCLOUD_APP_ID: '123456'
      ZEGOCLOUD_SERVER_SECRET: test-zegocloud-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Run unit tests
        run: npm run test -- --coverage --passWithNoTests

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  # ==================== BUILD & PUSH DOCKER IMAGE ====================
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

  # ==================== DEPLOY STAGING ====================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: https://api-staging.voxo.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to staging server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          script: |
            set -e
            cd /opt/voxo

            # Pull latest compose file
            git pull origin develop

            # Update environment
            echo "IMAGE_TAG=${{ needs.build.outputs.image_tag }}" > .env.deploy

            # Pull new images
            docker compose -f docker-compose.prod.yml pull voxo-backend

            # Rolling update
            docker compose -f docker-compose.prod.yml up -d --no-deps voxo-backend

            # Run migrations
            docker compose -f docker-compose.prod.yml exec -T voxo-backend npx prisma migrate deploy

            # Health check
            sleep 15
            curl -f https://api-staging.voxo.app/health || exit 1

            echo "Staging deployment successful"

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Staging deployment failed for commit ${{ github.sha }}'
            })

  # ==================== DEPLOY PRODUCTION ====================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://api.voxo.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to production server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          script: |
            set -e
            cd /opt/voxo

            # Pull latest compose file
            git pull origin main

            # Backup database
            docker compose -f docker-compose.prod.yml exec -T postgres \
              pg_dump -U voxo voxo > /backups/voxo_$(date +%Y%m%d_%H%M%S).sql

            # Update environment
            echo "IMAGE_TAG=${{ needs.build.outputs.image_tag }}" > .env.deploy

            # Pull new images
            docker compose -f docker-compose.prod.yml pull voxo-backend

            # Rolling update
            docker compose -f docker-compose.prod.yml up -d --no-deps voxo-backend

            # Run migrations
            docker compose -f docker-compose.prod.yml exec -T voxo-backend npx prisma migrate deploy

            # Health check with retries
            for i in 1 2 3 4 5; do
              sleep 10
              curl -f https://api.voxo.app/health && break || echo "Attempt $i failed"
            done

            curl -f https://api.voxo.app/health || exit 1
            echo "Production deployment successful"

      - name: Create deployment tag
        if: success()
        run: |
          git tag "deploy/prod-$(date +%Y%m%d-%H%M%S)"
          git push origin --tags
